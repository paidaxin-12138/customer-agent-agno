[project]
name = "agent-customer"
version = "1.1.0"
description = "电商AI客服"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.52.0",
    "websockets>=10.4",
    "requests>=2.28.0",
    "pyqt6>=6.9.0",
    "lancedb>=0.25.0",
    "pydantic>=2.5.0",
    "pyqt6-fluent-widgets>=1.9.0",
    "sqlalchemy>=2.0.43",
    "openai>=1.109.1",
    "agno>=2.3.4",
    "pillow>=12.0.0",
    "pandas>=2.1.0,<2.3.0",
    "loguru>=0.7.0",
    "pypdf",
    "openpyxl>=3.1.5",
    "aiohttp>=3.13.2",
    "python-dotenv>=1.0.0",
    "passlib>=1.7.4",
    "cryptography>=43.0.0",
    "xlrd>=2.0.2",
    "alembic>=1.14.0",
]

[project.optional-dependencies]
security = [
    "keyring>=25.0.0",
]
build = [
    "pyinstaller>=6.0.0",
]
ocr = [
    "paddlepaddle>=2.6.0",
    "paddleocr>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Agent", "Channel", "Message", "bridge", "core", "database", "ui", "utils", "scripts"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "pytest-qt>=4.4.0",
    "pip-audit>=2.7.0",
    "black>=24.0.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.coverage.run]
branch = true
source = ["Message", "bridge", "core", "database", "utils", "Channel", "Agent"]
omit = [
    "*/test/*",
    "*/tests/*",
    "*/.venv/*",
    "*/venv/*",
    "ui/*",
    "scripts/*",
    "alembic/*",
    "app.py",
    "config.py",
    "database/db_manager.py",
    "database/chat_store.py",
    "database/connection_pool.py",
    "database/ops_repository.py",
    "database/ops_migrate.py",
    "core/di_container.py",
    "core/chat_sync.py",
    "core/human_assist_ui.py",
    "core/channel_facade.py",
    "Message/keyword_reload.py",
    "utils/ocr_*",
    "utils/runtime_path.py",
    "utils/shortcuts.py",
    "utils/window_focus.py",
    "utils/resource_manager.py",
    "utils/path_utils.py",
    "utils/password_utils.py",
    "utils/empty_state.py",
    "utils/encoding_helper.py",
    "utils/file_validator.py",
    "utils/loading_widget.py",
    "utils/logging_context.py",
    "utils/dialogs.py",
    "Message/handlers/address_change_handler.py",
    "Message/handlers/after_sales_apply_handler.py",
    "Message/handlers/image_video_handler.py",
    "Message/handlers/order_logistics_handler.py",
    "database/chat_persist.py",
    "database/session_store.py",
    "utils/session_order_cache.py",
    "utils/pdd_transfer.py",
    "utils/transfer_takeover.py",
    "utils/human_escalation_comfort.py",
    "utils/inbound_transfer_gate.py",
    "utils/merchant_refund_apply_record.py",
    "utils/merchant_address_change_record.py",
    "utils/chat_message_html.py",
    "utils/chat_time.py",
    "utils/chat_image_cache.py",
    "core/cache.py",
    "core/mms_session_sync.py",
    "core/ops_telemetry.py",
    "core/human_assist_bus.py",
    "core/production_services.py",
    "core/base_service.py",
    "Message/core/handlers.py",
    "Message/handler_chain_factory.py",
    "Channel/pinduoduo/pdd_login.py",
    "Channel/pinduoduo/utils/mms_chat_browser.py",
    "Channel/pinduoduo/utils/mms_goods_browser.py",
    "Channel/pinduoduo/utils/API/*",
    "Channel/pinduoduo/utils/base_request.py",
    "Agent/CustomerAgent/agent.py",
    "Agent/CustomerAgent/conversation_memory.py",
    "Agent/CustomerAgent/tools/*",
]

[tool.coverage.report]
# CI 使用 scripts/coverage_ci.ini（含 Channel/Agent 重构模块）；门禁 55%
# 本地单文件/子集测试默认不跑 --cov，避免误失败
show_missing = true
precision = 1

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-m",
    "not perf",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "perf: 性能基线探针（仅输出指标，非门禁）",
]
